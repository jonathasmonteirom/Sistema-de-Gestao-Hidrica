services:
  db:
    image: postgres:16-alpine
    container_name: cisternas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: cisternas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cisternas"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cisternas_flask
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-12345}@db:5432/cisternas
    ports:
      - "5000:5000"

volumes:
  postgres_data: